<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" width="180" height="40">
  <!-- Left App Icon -->
  <g transform="translate(2, 2)">
    <!-- Squircle Background -->
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Viewfinder corners -->
    <g fill="none" stroke="#15272E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 11 L 6 8 A 2.5 2.5 0 0 1 8.5 6 L 11 6" />
      <path d="M 25 6 L 27.5 6 A 2.5 2.5 0 0 1 30 8.5 L 30 11" />
      <path d="M 6 25 L 6 27.5 A 2.5 2.5 0 0 0 8.5 30 L 11 30" />
      <path d="M 25 30 L 27.5 30 A 2.5 2.5 0 0 0 30 27.5 L 30 25" />
    </g>

    <!-- Receipt paper -->
    <path d="M 11 9 L 19 9 L 24 14 L 24 28 L 22 26.5 L 20 28 L 18 26.5 L 16 28 L 14 26.5 L 12 28 L 11 27 Z" 
          fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />

    <!-- Folded green corner -->
    <path d="M 19 9 L 19 13 A 1 1 0 0 0 20 14 L 24 14 Z" fill="#289E77" />

    <!-- Bar chart columns -->
    <rect x="13" y="20" width="2.2" height="5" rx="1" fill="#7FD4B5" />
    <rect x="16" y="17" width="2.2" height="8" rx="1" fill="#33B585" />
    <rect x="19" y="14" width="2.2" height="11" rx="1" fill="#178761" />
  </g>

  <!-- Typography -->
  <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#15272E" letter-spacing="-0.5">Input</text>
  <text x="105" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#289E77" letter-spacing="-0.5">Mi</text>
</svg>
